[package]
name = "telephone"
version = "0.1.1"
edition = "2021"
description = "CLI and MCP server for messaging between local coding agents"
license = "MIT"
repository = "https://github.com/iamnbutler/telephone"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "SECURITY.md", "LICENSE"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits"] }
libc = "0.2"
socket2 = "0.6"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
