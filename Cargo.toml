[package]
name = "telephone"
version = "0.1.0"
edition = "2021"
description = "Agent-agnostic communication layer for coding agents"
license = "MIT"
repository = "https://github.com/iamnbutler/telephone"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
