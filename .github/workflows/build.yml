name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "telephone") | .version')
          [[ "$RELEASE_TAG" == "v$version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "releases/$version.md"
      - name: Test
        run: cargo test --locked --all-targets --target "$TARGET"
      - name: Lint
        run: cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings
      - name: Package and smoke-test
        run: bash scripts/package.sh "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telephone-${{ matrix.target }}
          path: target/release-packages/telephone-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: telephone-*
          merge-multiple: true
          path: artifacts
      - name: Verify complete artifact set and generate checksums
        working-directory: artifacts
        run: |
          archives=(
            telephone-aarch64-apple-darwin.tar.gz
            telephone-x86_64-apple-darwin.tar.gz
            telephone-aarch64-unknown-linux-musl.tar.gz
            telephone-x86_64-unknown-linux-musl.tar.gz
          )
          for archive in "${archives[@]}"; do
            test -s "$archive"
            tar -tzf "$archive" | grep -qx telephone
          done
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish only after all assets are uploaded
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$state" != true ]]; then
              echo 'This release is already published; refusing to overwrite its assets.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Telephone $RELEASE_TAG" --notes-file "releases/${RELEASE_TAG#v}.md"
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.tar.gz artifacts/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
