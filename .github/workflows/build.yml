name: Build and release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # A manual notarization check need not queue behind the ordinary main build.
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # Let rustc supply its matching musl startup objects and static libraries.
      # The distro musl-gcc wrapper can mix in incompatible static-PIE objects.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: cc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "telephone") | .version')
          [[ "$RELEASE_TAG" == "v$version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "releases/$version.md"
      - name: Test
        run: cargo test --locked --all-targets --target "$TARGET"
      - name: Stress MCP bulk-response test
        if: runner.os == 'macOS'
        run: |
          # Independent real servers and SQLite stores compete for runner time.
          pids=()
          for attempt in {1..4}; do
            printf 'Starting bulk-response stress run %s\n' "$attempt"
            cargo test --locked --bin telephone --target "$TARGET" \
              mcp::integration::cancellation_during_partial_output_preserves_framing_but_not_the_receipt \
              -- --exact &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          exit "$failed"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings
      - name: Test signing and notarization preflight
        if: runner.os == 'macOS'
        run: |
          bash scripts/test-sign-macos.sh
          bash scripts/test-notarize-macos.sh
      - name: Package and smoke-test
        run: bash scripts/package.sh "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telephone-${{ matrix.target }}
          path: target/release-packages/telephone-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign-macos:
    name: Sign and notarize (${{ matrix.target }})
    # Never expose signing credentials to a pull request, including same-repo PRs.
    # A manual run tests merged main without publishing a release.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telephone-${{ matrix.target }}
          path: artifacts
      - name: Read package version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "telephone") | .version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Developer ID sign and verify
        timeout-minutes: 5
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: bash scripts/sign-macos.sh "$TARGET" "artifacts/telephone-$TARGET.tar.gz" "signed/telephone-$TARGET.tar.gz"
      - name: Notarize signed binary
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: bash scripts/notarize-macos.sh "$TARGET" "signed/telephone-$TARGET.tar.gz" "notarization/$TARGET"
      - name: Preserve notarization receipt and log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarization-${{ matrix.target }}
          path: notarization/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
      # The signing step has removed its keychain, and no secrets are in this
      # step's environment. Only now execute the signed build output.
      - name: Smoke-test signed archive
        run: |
          extracted=$(mktemp -d "$RUNNER_TEMP/telephone-signed-check.XXXXXX")
          tar -xzf "signed/telephone-$TARGET.tar.gz" -C "$extracted"
          codesign --verify --strict "$extracted/telephone"
          bash scripts/smoke-test.sh "$extracted/telephone" "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-telephone-${{ matrix.target }}
          path: signed/telephone-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign-macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: telephone-*-unknown-linux-musl
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-telephone-*-apple-darwin
          merge-multiple: true
          path: artifacts
      - name: Verify complete artifact set and generate checksums
        working-directory: artifacts
        run: |
          archives=(
            telephone-aarch64-apple-darwin.tar.gz
            telephone-x86_64-apple-darwin.tar.gz
            telephone-aarch64-unknown-linux-musl.tar.gz
            telephone-x86_64-unknown-linux-musl.tar.gz
          )
          for archive in "${archives[@]}"; do
            test -s "$archive"
            # Read the entire listing: grep -q can close the pipe early and
            # make tar fail with SIGPIPE under bash's pipefail option.
            tar -tzf "$archive" | grep -x telephone > /dev/null
          done
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish only after all assets are uploaded
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$state" != true ]]; then
              echo 'This release is already published; refusing to overwrite its assets.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Telephone $RELEASE_TAG" --notes-file "releases/${RELEASE_TAG#v}.md"
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.tar.gz artifacts/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
